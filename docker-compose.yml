services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algotracker}
      POSTGRES_USER: ${POSTGRES_USER:-algotracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algotracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-algotracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-algotracker}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./${FIREBASE_CREDENTIALS_PATH}:/app/${FIREBASE_CREDENTIALS_PATH}:ro
    healthcheck:
      # Sends the first allowed host as the Host header, so ALLOWED_HOSTS does not reject the request.
      test: ["CMD", "python", "-c", "import os, urllib.request as u; h = os.environ.get('ALLOWED_HOSTS', 'localhost').split(',')[0].strip(); u.urlopen(u.Request('http://127.0.0.1:8000/api/health/', headers={'Host': h}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-tasks:
    build: .
    restart: unless-stopped
    command: python manage.py rqworker default --with-scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-algotracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-algotracker}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./${FIREBASE_CREDENTIALS_PATH}:/app/${FIREBASE_CREDENTIALS_PATH}:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-push-sweeper:
    build: .
    restart: unless-stopped
    command: python manage.py push_sweep
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-algotracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-algotracker}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./${FIREBASE_CREDENTIALS_PATH}:/app/${FIREBASE_CREDENTIALS_PATH}:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-leaderboard:
    build: .
    restart: unless-stopped
    command: python manage.py leaderboard_rank
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-algotracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-algotracker}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-websocket:
    build: .
    restart: unless-stopped
    command: python websocket_worker.py
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-algotracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-algotracker}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./${FIREBASE_CREDENTIALS_PATH}:/app/${FIREBASE_CREDENTIALS_PATH}:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
