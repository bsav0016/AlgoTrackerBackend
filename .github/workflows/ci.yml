name: CI

# Pull-request checks. There is no deployment here: deploys stay manual
# (git pull && docker compose up --build -d on the server).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres for the credit concurrency tests (SQLite has no row locks). Free, and gone after the run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Dependencies are consistent
        run: pip check
      - name: No private-network URLs or secret keys in tracked files
        run: |
          if git grep -nIE 'https?://(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.)|sk_live_[A-Za-z0-9]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!*.md' ':!.env.example'; then
            echo "::error::Hard-coded private URL or secret key found; use environment configuration."
            exit 1
          fi
      - name: Static analysis (syntax errors, undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      # The steps below use algo_tracker_backend.test_settings: fake keys, in-memory
      # SQLite, no Redis, and a guard that fails any test opening a non-local socket.
      # No secrets are needed, and TwelveData, Stripe and Expo are never contacted.
      - name: Django system check
        run: python manage.py check --settings=algo_tracker_backend.test_settings
      - name: Model changes have migrations
        run: python manage.py makemigrations api --check --dry-run --settings=algo_tracker_backend.test_settings
      - name: Tests
        run: python manage.py test
      - name: Whole suite again on Postgres (includes the credit concurrency tests)
        run: python manage.py test
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/postgres

  docker:
    name: Docker config and image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate docker-compose.yml with placeholder values
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=ci-placeholder" >> .env
          docker compose config --quiet
      - name: Build the application image
        run: docker build --tag algotracker-api:ci .
      # Proves the image has every dependency; test settings use no live services or credentials.
      - name: Run the tests inside the image
        run: docker run --rm algotracker-api:ci python manage.py test
      # The Django admin and the browsable API need their collected static files, and whitenoise needs its manifest.
      # DEBUG=True and a throwaway key only make settings.py importable without real secrets (SQLite, no Redis needed).
      - name: Static files are collected into the image and served
        run: |
          docker run --rm -e DEBUG=True -e SECRET_KEY=ci-only algotracker-api:ci python -c "
          import os, django
          os.environ['DJANGO_SETTINGS_MODULE'] = 'algo_tracker_backend.settings'
          django.setup()
          from django.conf import settings
          from django.test import Client
          assert os.path.exists(os.path.join(settings.STATIC_ROOT, 'staticfiles.json')), 'no static manifest'
          r = Client(HTTP_HOST='localhost').get('/static/admin/css/base.css')
          assert r.status_code == 200, r.status_code
          # The admin login page renders every static file through the manifest; a missing entry raises here.
          assert Client(HTTP_HOST='localhost').get('/admin/login/').status_code == 200
          print('static ok')"
      - name: Migrations apply to an empty database inside the image
        run: docker run --rm -e DEBUG=True -e SECRET_KEY=ci-only algotracker-api:ci python manage.py migrate --noinput
      - name: The migrate service is wired in front of the app services
        run: |
          docker compose config --format json > compose.json
          python3 - <<'PY'
          import json
          services = json.load(open("compose.json"))["services"]
          assert services["migrate"]["restart"] == "no"
          for name in ("web", "worker-tasks", "worker-push-sweeper", "worker-leaderboard", "worker-websocket"):
              dep = services[name]["depends_on"]["migrate"]
              assert dep["condition"] == "service_completed_successfully", name
          print("compose ok")
          PY
